<html lang="hi">
<head>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>मानस न्यूज-24</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:grid;place-items:center;background:#fff}
.logo{width:min(44vw,190px);height:auto;display:block}
</style>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function(error) {
      console.error('Service worker registration failed:', error);
    });
  });
}
window.addEventListener("load",function(){
  window.setTimeout(function(){
    window.location.replace("https://manasnews.blogspot.com/");
  },1200);
});
</script>
</head>
<body>
<main aria-label="मानस न्यूज-24">
<img class="logo" src="./icon-512.png" alt="मानस न्यूज-24">
</main>
<noscript><a href="https://manasnews.blogspot.com/">मानस न्यूज-24 की मुख्य वेबसाइट खोलें</a></noscript>
</body>
</html>
