<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082a70">
<meta name="description" content="मानस न्यूज-24 — जनता की आवाज">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>मानस न्यूज-24</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{display:grid;place-items:center;background:#fff;color:#172b3c;font-family:Arial,'Noto Sans Devanagari',sans-serif;padding:24px}
main{width:min(100%,420px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.logo{width:min(44vw,160px);height:auto;display:block}
h1{font-size:22px;margin:0}
p{font-size:15px;line-height:1.65;margin:0;color:#536477}
button,.home-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;border:0;border-radius:8px;background:#082a70;color:#fff;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
#install-panel[hidden]{display:none}
#status{min-height:24px;font-size:14px;color:#536477}
</style>
</head>
<body>
<main aria-label="मानस न्यूज-24">
<img class="logo" src="./icon-512.png" alt="मानस न्यूज-24">
<section id="install-panel" hidden>
<h1>मानस न्यूज-24 ऐप इंस्टॉल करें</h1>
<p>नीचे बटन दबाएं। Chrome में इंस्टॉल विकल्प उपलब्ध होने पर पुष्टि करें।</p>
<button id="install-button" type="button">ऐप इंस्टॉल करें</button>
<p id="status" role="status" aria-live="polite"></p>
</section>
</main>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const installMode=params.get('install')==='1';
 let deferredPrompt=null;
 const panel=document.getElementById('install-panel');
 const button=document.getElementById('install-button');
 const status=document.getElementById('status');
 if('serviceWorker' in navigator){
   window.addEventListener('load',function(){
     navigator.serviceWorker.register('./sw.js').catch(function(error){
       console.error('Service worker registration failed:',error);
     });
   });
 }
 if(installMode){
   panel.hidden=false;
   window.addEventListener('beforeinstallprompt',function(event){
     event.preventDefault();
     deferredPrompt=event;
     button.disabled=false;
     status.textContent='इंस्टॉल विकल्प तैयार है।';
   });
   button.addEventListener('click',async function(){
     if(deferredPrompt){
       const promptEvent=deferredPrompt;
       deferredPrompt=null;
       await promptEvent.prompt();
       const choice=await promptEvent.userChoice;
       status.textContent=choice.outcome==='accepted'?'ऐप इंस्टॉल होना शुरू हो गया है।':'इंस्टॉल रद्द किया गया।';
       button.disabled=choice.outcome==='accepted';
       return;
     }
     status.textContent='यदि Chrome में इंस्टॉल विकल्प उपलब्ध नहीं दिखता, तो ऊपर ⋮ मेन्यू खोलकर “ऐप इंस्टॉल करें” या “होम स्क्रीन पर जोड़ें” चुनें।';
   });
   window.addEventListener('appinstalled',function(){
     status.textContent='मानस न्यूज-24 ऐप इंस्टॉल हो गया है।';
     button.hidden=true;
   });
 }else{
   window.addEventListener('load',function(){
     window.setTimeout(function(){
       window.location.replace('https://manasnews.blogspot.com/');
     },1200);
   });
 }
})();
</script>
<noscript><a class="home-link" href="https://manasnews.blogspot.com/">मानस न्यूज-24 की मुख्य वेबसाइट खोलें</a></noscript>
</body>
</html>
