<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082a70">
<meta name="description" content="मानस न्यूज-24 — जनता की आवाज">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>मानस न्यूज-24</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{min-height:100vh;min-height:100svh;background:#fff;color:#172b3c;font-family:Arial,'Noto Sans Devanagari',sans-serif}
main{width:100%;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:24px 22px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));background:#fff}
.logo{width:min(88vw,410px);max-height:42svh;height:auto;object-fit:contain;display:block}
#install-panel{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:16px}
#install-panel[hidden]{display:none}
.eyebrow{margin:0;color:#c82026;font-size:17px;font-weight:800;letter-spacing:.02em}
h1{font-size:clamp(29px,7.5vw,38px);line-height:1.3;margin:0;color:#102b55;font-weight:800}
p{font-size:18px;line-height:1.55;margin:0;color:#536477}
button,.home-link{width:100%;min-height:88px;display:flex;align-items:center;justify-content:center;padding:18px 20px;border:0;border-radius:14px;background:#082a70;color:#fff;font-size:26px;font-weight:800;text-decoration:none;cursor:pointer;box-shadow:0 6px 16px rgba(8,42,112,.2);touch-action:manipulation}
button:active{transform:scale(.99)}
button:disabled{opacity:.65;cursor:default}
#status{width:100%;min-height:22px;padding:0 4px;font-size:16px;color:#1b5c42}
.help{width:100%;padding:14px 15px;border-radius:12px;background:#f1f5fa;color:#4b5d72;font-size:15px;line-height:1.55}
@media(max-height:720px){main{gap:14px;padding:14px 18px}.logo{width:min(78vw,330px);max-height:34svh}#install-panel{gap:10px}button{min-height:72px;font-size:23px}.help{padding:10px 12px;font-size:14px}}
@media(min-width:700px){main{padding-left:32px;padding-right:32px}.logo{width:min(60vw,410px)}}
</style>
</head>
<body>
<main aria-label="मानस न्यूज-24">
<img class="logo" src="./icon-512.png" alt="मानस न्यूज-24">
<section id="install-panel" hidden>
<p class="eyebrow">आपका अपना समाचार ऐप</p>
<h1>मानस न्यूज-24</h1>
<p>अपने मोबाइल में ऐप इंस्टॉल करें और एक टच में खबरें पढ़ें।</p>
<button id="install-button" type="button">ऐप इंस्टॉल करें</button>
<p id="status" role="status" aria-live="polite"></p>
<p class="help">यदि इंस्टॉल का विकल्प न खुले, तो Chrome के ऊपर ⋮ मेन्यू में “ऐप इंस्टॉल करें” या “होम स्क्रीन पर जोड़ें” चुनें।</p>
</section>
</main>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const installMode=params.get('install')==='1';
 let deferredPrompt=null;
 const panel=document.getElementById('install-panel');
 const button=document.getElementById('install-button');
 const status=document.getElementById('status');
 if('serviceWorker' in navigator){
   window.addEventListener('load',function(){
     navigator.serviceWorker.register('./sw.js').catch(function(error){
       console.error('Service worker registration failed:',error);
     });
   });
 }
 if(installMode){
   panel.hidden=false;
   window.addEventListener('beforeinstallprompt',function(event){
     event.preventDefault();
     deferredPrompt=event;
     status.textContent='इंस्टॉल विकल्प तैयार है।';
   });
   button.addEventListener('click',async function(){
     if(deferredPrompt){
       const promptEvent=deferredPrompt;
       deferredPrompt=null;
       await promptEvent.prompt();
       const choice=await promptEvent.userChoice;
       status.textContent=choice.outcome==='accepted'?'ऐप इंस्टॉल होना शुरू हो गया है।':'इंस्टॉल रद्द किया गया।';
       button.disabled=choice.outcome==='accepted';
       return;
     }
     status.textContent='इस ब्राउज़र में सीधा इंस्टॉल विकल्प उपलब्ध नहीं हुआ। Chrome के ⋮ मेन्यू से “ऐप इंस्टॉल करें” या “होम स्क्रीन पर जोड़ें” चुनें।';
   });
   window.addEventListener('appinstalled',function(){
     status.textContent='मानस न्यूज-24 ऐप इंस्टॉल हो गया है।';
     button.hidden=true;
   });
 }else{
   window.addEventListener('load',function(){
     window.setTimeout(function(){
       window.location.replace('https://manasnews.blogspot.com/');
     },1200);
   });
 }
})();
</script>
<noscript><a class="home-link" href="https://manasnews.blogspot.com/">मानस न्यूज-24 की मुख्य वेबसाइट खोलें</a></noscript>
</body>
</html>
