<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b55"><title>स्थानीय खबरें और न्यूज मैप | मानस न्यूज-24</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17263d;font-family:Arial,"Noto Sans Devanagari",sans-serif}.top{background:#102b55;color:#fff;padding:14px 16px;font-weight:900}.top a{float:right;color:#fff}.wrap{max-width:950px;margin:auto;padding:12px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;min-height:44px;border:1px solid #cbd6e5;border-radius:9px;background:#fff;font-weight:800}.tabs button.active{background:#102b55;color:white}.panel{display:none;background:#fff;border:1px solid #e0e6ef;border-radius:13px;padding:14px}.panel.active{display:block}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls input,.controls select{width:100%;padding:11px;border:1px solid #d5dce8;border-radius:9px}.story{padding:13px 0;border-bottom:1px solid #e6ebf2}.story h3{font-size:18px;margin:0 0 6px}.story p{font-size:14px;line-height:1.7;color:#52627a;margin:5px 0}.story a{color:#173d77;font-weight:800;text-decoration:none}.hint{font-size:12px;color:#68758a;line-height:1.6}#map{height:62vh;min-height:340px;border-radius:10px}.btn{padding:10px 12px;border:0;border-radius:8px;background:#102b55;color:#fff;font-weight:800}@media(max-width:520px){.controls{grid-template-columns:1fr}.wrap{padding:8px}}
</style></head><body><header class="top">मानस न्यूज-24 · स्थानीय खबरें <a href="https://manasnews.blogspot.com/">मुख्य वेबसाइट</a></header><main class="wrap"><div class="tabs"><button class="active" data-tab="feed">मेरी खबरें</button><button data-tab="mapPanel">लोकल न्यूज मैप</button></div>
<section class="panel active" id="feed"><h2 style="margin:0 0 10px">अपनी पसंद की खबरें</h2><div class="controls"><input id="locationFilter" placeholder="गांव / ब्लॉक / जिला लिखें"><select id="categoryFilter"><option value="">सभी श्रेणियां</option></select></div><p class="hint">आपकी पसंद इसी डिवाइस में सुरक्षित रहेगी।</p><div id="stories"><p class="hint">खबरें लोड हो रही हैं…</p></div></section>
<section class="panel" id="mapPanel"><h2 style="margin:0 0 10px">खबरों का स्थान मानचित्र</h2><p class="hint">नक्शे पर केवल वही प्रकाशित खबरें दिखेंगी जिनके अक्षांश और देशांतर संपादक ने दर्ज किए हैं।</p><div id="map"></div><div id="mapStatus" class="hint"></div></section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.119.0';
import L from 'https://esm.sh/leaflet@1.9.4';
const db=createClient('https://umgtkiwnvzahvdxafypt.supabase.co','sb_publishable_VsLBwd7OWwnbpCiBXnWyQA_FtRaDTh_',{auth:{persistSession:false,autoRefreshToken:false}});
const $=id=>document.getElementById(id);let stories=[],map=null;
let sid=sessionStorage.getItem('mn24_analytics_session');if(!sid){sid=crypto.randomUUID();sessionStorage.setItem('mn24_analytics_session',sid)}
const device=/tablet|ipad/i.test(navigator.userAgent)?'tablet':(/mobile|android|iphone/i.test(navigator.userAgent)?'mobile':'desktop');
function track(event_name,url=''){db.from('analytics_events').insert({event_name,page_path:location.pathname,article_url:url,referrer_host:(()=>{try{return document.referrer?new URL(document.referrer).host:''}catch{return ''}})(),session_key:sid,device_type:device}).then(()=>{}).catch(()=>{})}
track('page_view');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));if(b.dataset.tab==='mapPanel'&&map)setTimeout(()=>map.invalidateSize(),80)});
async function init(){const [news,cats]=await Promise.all([db.from('news_articles').select('id,title,summary,dateline,category_id,published_url,featured_image_url,published_at,latitude,longitude,news_categories(name)').eq('status','published').order('published_at',{ascending:false}).limit(200),db.from('news_categories').select('id,name').eq('is_active',true).order('sort_order')]);if(news.error){$('stories').textContent='खबरें लोड नहीं हुईं।';return}stories=news.data||[];$('categoryFilter').innerHTML='<option value="">सभी श्रेणियां</option>'+(cats.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');const saved=JSON.parse(localStorage.getItem('mn24_reader_preferences')||'{}');$('locationFilter').value=saved.location||'';$('categoryFilter').value=saved.category||'';render();initMap()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const loc=$('locationFilter').value.trim().toLowerCase(),cat=$('categoryFilter').value;localStorage.setItem('mn24_reader_preferences',JSON.stringify({location:loc,category:cat}));const rows=stories.filter(x=>(!loc||String(x.dateline||'').toLowerCase().includes(loc))&&(!cat||x.category_id===cat));$('stories').innerHTML=rows.length?rows.map(x=>'<article class="story">'+(x.featured_image_url?'<img src="'+esc(x.featured_image_url)+'" alt="" loading="lazy" style="width:100%;max-height:220px;object-fit:cover;border-radius:9px">':'')+'<h3>'+esc(x.title)+'</h3><p>'+esc(x.summary||'')+'</p><p class="hint">'+esc(x.dateline||'')+' · '+esc(x.news_categories?.name||'')+'</p>'+(x.published_url?'<a href="'+esc(x.published_url)+'" target="_blank" rel="noopener" data-story="'+esc(x.published_url)+'">पूरी खबर पढ़ें</a>':'<span class="hint">पूरी खबर का लिंक संपादकीय टीम द्वारा जोड़ा जाना बाकी है।</span>')+'</article>').join(''):'<p class="hint">आपकी चुनी पसंद से मेल खाती प्रकाशित खबर उपलब्ध नहीं है। पसंद बदलकर देखें।</p>';$('stories').querySelectorAll('[data-story]').forEach(a=>a.onclick=()=>track('article_view',a.dataset.story))}
$('locationFilter').oninput=render;$('categoryFilter').onchange=render;
function initMap(){map=L.map('map').setView([25.3,82.0],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const points=stories.filter(x=>Number.isFinite(x.latitude)&&Number.isFinite(x.longitude));points.forEach(x=>L.marker([x.latitude,x.longitude]).addTo(map).bindPopup('<b>'+esc(x.title)+'</b><br>'+esc(x.dateline||'')+(x.published_url?'<br><a href="'+esc(x.published_url)+'" target="_blank">खबर पढ़ें</a>':'')));$('mapStatus').textContent=points.length?points.length+' खबरों के स्थान नक्शे पर दिखाए गए।':'अभी किसी प्रकाशित खबर में निर्देशांक दर्ज नहीं हैं। संपादक खबर में अक्षांश/देशांतर जोड़ें।'}
init();
</script></body></html>
