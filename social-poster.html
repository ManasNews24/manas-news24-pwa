<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c36"><title>सोशल न्यूज पोस्टर | मानस न्यूज-24</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f8;color:#182238;font-family:Arial,"Noto Sans Devanagari",sans-serif}.top{background:#101c36;color:#fff;padding:14px 16px;font-weight:800}.top a{float:right;color:#fff;font-size:13px}.wrap{max-width:1050px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:14px}.panel{background:#fff;border:1px solid #dfe4ec;border-radius:14px;padding:14px}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:12px;font-weight:800}.field input,.field textarea{width:100%;padding:10px;border:1px solid #d5dce8;border-radius:9px;font:inherit}.field textarea{min-height:86px;resize:vertical}.btn{border:0;border-radius:9px;padding:12px 14px;font-weight:800;background:#101c36;color:#fff;min-height:44px}.btn.alt{background:#e9eef6;color:#182238}.actions{display:flex;gap:8px;flex-wrap:wrap}.preview{display:grid;place-items:center;min-height:65vh;background:#e6eaf1;border-radius:12px;padding:12px}.preview canvas{width:min(100%,520px);height:auto;background:#fff;box-shadow:0 8px 30px #17243a22}.hint{font-size:12px;color:#69758b;line-height:1.6}@media(max-width:760px){.wrap{grid-template-columns:1fr;padding:9px}.preview{min-height:0}.preview canvas{width:min(100%,430px)}}
</style></head><body><header class="top">मानस न्यूज-24 · सोशल पोस्टर <a href="./admin.html">न्यूज़रूम</a></header>
<main class="wrap"><section class="panel"><h2 style="margin:0 0 12px">पोस्टर तैयार करें</h2><p class="hint">शीर्षक, संक्षिप्त जानकारी और फोटो जोड़ें। पोस्टर आपके मोबाइल में PNG के रूप में बनेगा।</p>
<div class="field"><label for="headline">खबर का शीर्षक *</label><textarea id="headline" maxlength="180" placeholder="यहां खबर का शीर्षक लिखें"></textarea></div>
<div class="field"><label for="deck">संक्षिप्त विवरण</label><textarea id="deck" maxlength="260" placeholder="खबर की मुख्य जानकारी"></textarea></div>
<div class="field"><label for="place">स्थान / डेटलाइन</label><input id="place" maxlength="80" value="मांडा, प्रयागराज"></div>
<div class="field"><label for="photo">फोटो चुनें (वैकल्पिक)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></div>
<div class="field"><label for="credit">फोटो श्रेय</label><input id="credit" maxlength="100" placeholder="फोटो: मानस न्यूज-24"></div>
<div class="actions"><button class="btn" id="download">PNG डाउनलोड करें</button><button class="btn alt" id="share">शेयर करें</button><button class="btn alt" id="reset">रीसेट</button></div><p id="status" class="hint" role="status" aria-live="polite"></p></section>
<section class="panel"><div class="preview"><canvas id="poster" width="1080" height="1350" aria-label="सोशल पोस्टर प्रीव्यू"></canvas></div></section></main>
<script>
(()=>{const $=id=>document.getElementById(id),c=$('poster'),ctx=c.getContext('2d');let photo=null;
function wrap(text,maxWidth,font){ctx.font=font;const words=String(text||'').split(/\s+/);const lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines}
function draw(){const w=c.width,h=c.height;const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#0d2859');g.addColorStop(1,'#153f80');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#e5b85b';ctx.fillRect(0,0,w,18);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 54px Arial,"Noto Sans Devanagari",sans-serif';ctx.fillText('मानस न्यूज-24',68,105);ctx.fillStyle='#e5b85b';ctx.fillRect(68,132,w-136,5);
let y=205;const title=$('headline').value.trim()||'खबर का शीर्षक यहां दिखाई देगा';const titleFont='bold 64px Arial,"Noto Sans Devanagari",sans-serif';const tl=wrap(title,w-136,titleFont).slice(0,3);ctx.fillStyle='#fff';ctx.font=titleFont;for(const line of tl){ctx.fillText(line,68,y);y+=82}
y+=12;if(photo){const maxH=510,maxW=w-136,ratio=Math.min(maxW/photo.width,maxH/photo.height);const iw=photo.width*ratio,ih=photo.height*ratio;ctx.drawImage(photo,(w-iw)/2,y,iw,ih);y+=ih+22}
const deck=$('deck').value.trim();if(deck){ctx.fillStyle='#f2c96d';ctx.font='bold 35px Arial,"Noto Sans Devanagari",sans-serif';for(const line of wrap(deck,w-136,'bold 35px Arial,"Noto Sans Devanagari",sans-serif').slice(0,4)){ctx.fillText(line,68,y);y+=49}}
ctx.fillStyle='#d9e4f7';ctx.font='28px Arial,"Noto Sans Devanagari",sans-serif';ctx.fillText($('place').value.trim()||'मानस न्यूज-24',68,h-100);ctx.textAlign='right';ctx.font='24px Arial,"Noto Sans Devanagari",sans-serif';ctx.fillText($('credit').value.trim()||'मानस न्यूज-24',w-68,h-55);ctx.textAlign='left';ctx.fillStyle='#e5b85b';ctx.fillRect(68,h-35,w-136,5)}
['headline','deck','place','credit'].forEach(id=>$(id).addEventListener('input',draw));$('photo').addEventListener('change',()=>{const file=$('photo').files[0];if(!file){photo=null;draw();return}if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>12*1024*1024){$('status').textContent='JPG, PNG या WebP फोटो अधिकतम 12 MB चुनें।';$('photo').value='';return}const img=new Image();img.onload=()=>{photo=img;draw();$('status').textContent='फोटो पोस्टर में जोड़ दी गई।'};img.onerror=()=>{$('status').textContent='फोटो पढ़ी नहीं जा सकी।'};img.src=URL.createObjectURL(file)});
$('download').onclick=()=>{if(!$('headline').value.trim()){$('status').textContent='पहले खबर का शीर्षक लिखें।';$('headline').focus();return}c.toBlob(blob=>{if(!blob){$('status').textContent='पोस्टर तैयार नहीं हुआ।';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Manas-News24-Social-Poster.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);$('status').textContent='पोस्टर PNG डाउनलोड हो गया।'},'image/png')};
$('share').onclick=async()=>{if(!$('headline').value.trim()){$('status').textContent='पहले शीर्षक लिखें।';return}const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)return;const file=new File([blob],'Manas-News24-Poster.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:$('headline').value.trim(),text:'मानस न्यूज-24'})}catch(e){if(e.name!=='AbortError')$('status').textContent='शेयर नहीं हो सका। PNG डाउनलोड करें।'}}else $('status').textContent='इस ब्राउज़र में सीधे शेयर की सुविधा नहीं है। PNG डाउनलोड करके WhatsApp पर साझा करें।'};
$('reset').onclick=()=>{$('headline').value='';$('deck').value='';$('place').value='मांडा, प्रयागराज';$('photo').value='';$('credit').value='';photo=null;$('status').textContent='';draw()};draw()})();
</script></body></html>
